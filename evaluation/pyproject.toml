[tool.poetry]
name = "evaluation"
version = "0.1.0"
description = ""
authors = ["Mateusz Galiński, Ryszard Tuora"]
readme = "README.md"


[tool.poetry-exec-plugin.commands]
black = "black --check --diff evaluation/"
blackf = "black evaluation/"
isort = "isort --profile=black --check-only --diff evaluation/"
isortf = "isort --profile=black evaluation/"
mypy = "mypy --ignore-missing-imports --check-untyped-defs evaluation/"
pylint = "pylint --rcfile=pyproject.toml evaluation/"


[tool.poetry.dependencies]
python = ">=3.10,<3.13"
httpx = "0.27.2"
json-repair = "0.30.2"
langchain-huggingface = "^0.1.2"
langchain-openai = "0.2.9"
matplotlib = "3.9.3"
mlflow = "2.18.0"
openai = "1.55.2"
pandas = "2.2.3"
ragas = "0.4.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "24.10.0"
pylint = "3.3.1"
mypy = "1.13.0"
isort = "5.13.2"
ipython = "7.12.0"


[[tool.poetry.source]]
name = "PyPI"
priority = "primary"


[tool.pylint.main]
fail-under = 10

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "x", "x_", "fp", "fh", "df", "ax", "f"]

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "global-statement",
]

[tool.isort]
profile = "black"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
